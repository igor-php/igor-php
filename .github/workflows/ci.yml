name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint Go Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: false
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.5
          install-mode: goinstall
          args: --timeout=5m

  composer-validate:
    name: Validate Composer Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Composer
        run: composer validate --strict

  php-lint:
    name: Lint PHP Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Run PHP Lint
        run: |
          find src/ bin/ test/ -name "*.php" -print0 | xargs -0 -n1 php -l

  test:
    name: Test on ${{ matrix.os }} (PHP ${{ matrix.php-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        php-version: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      # The demo lab requires Symfony 8 (PHP >= 8.4): installing it enables the real container compilation test,
      # and warming its cache builds the Igor service map used by the lab regression test (TestLabsRegression)
      - name: Install demo-leak dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.php-version == '8.4'
        run: |
          composer install --no-interaction --no-progress --no-scripts -d examples/demo-leak
          php examples/demo-leak/bin/console cache:clear

      # The Laravel lab requires Laravel 13 (PHP >= 8.4): igor exports its service map with `php artisan igor:dump`
      - name: Install demo-leak-laravel dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.php-version == '8.4'
        run: composer install --no-interaction --no-progress --no-scripts -d examples/demo-leak-laravel

      - name: Run Tests with Race Detector & Coverage
        env:
          # On the job that installs the labs, a lab that cannot be audited fails instead of being skipped
          IGOR_LABS_REQUIRED: ${{ (matrix.os == 'ubuntu-latest' && matrix.php-version == '8.4') && '1' || '' }}
        run: go test -race -v -coverprofile coverage.out -covermode atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}

  # The bundle supports every maintained Symfony version: install the Symfony lab on each one,
  # compile its real container and expect the same findings as the Symfony 8 snapshot
  symfony-compat:
    name: Symfony compatibility (Symfony ${{ matrix.symfony }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { symfony: '6.4', php: '8.1' }
          - { symfony: '6.4', php: '8.4' }
          - { symfony: '7.4', php: '8.2' }
          - { symfony: '7.4', php: '8.4' }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Install demo-leak on Symfony ${{ matrix.symfony }}
        working-directory: examples/demo-leak
        run: |
          composer require --no-update --no-interaction "php:>=${{ matrix.php }}" \
            "symfony/console:${{ matrix.symfony }}.*" "symfony/dotenv:${{ matrix.symfony }}.*" \
            "symfony/framework-bundle:${{ matrix.symfony }}.*" "symfony/runtime:${{ matrix.symfony }}.*" \
            "symfony/yaml:${{ matrix.symfony }}.*"
          composer update -W --no-interaction --no-progress --no-scripts
          composer show symfony/framework-bundle | grep -E '^versions'
          php bin/console cache:clear

      - name: Run the lab tests
        env:
          IGOR_LABS_REQUIRED: '1'
        run: |
          go test -v -run 'TestIgorDiscoveryPass_RealSymfonyCompilation' ./cmd/igor
          go test -v -run 'TestLabsRegression/^demo-leak$' ./cmd/igor
