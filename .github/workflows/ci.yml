name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint Go Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: false
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.5
          install-mode: goinstall
          args: --timeout=5m

  composer-validate:
    name: Validate Composer Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Composer
        run: composer validate --strict

  php-lint:
    name: Lint PHP Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Run PHP Lint
        run: |
          find src/ bin/ test/ -name "*.php" -print0 | xargs -0 -n1 php -l

  test:
    name: Test on ${{ matrix.os }} (PHP ${{ matrix.php-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        php-version: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      # The demo lab requires Symfony 8 (PHP >= 8.4): installing it enables the real container compilation test
      - name: Install demo-leak dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.php-version == '8.4'
        run: composer install --no-interaction --no-progress --no-scripts -d examples/demo-leak

      - name: Run Tests with Race Detector & Coverage
        run: go test -race -v -coverprofile coverage.out -covermode atomic ./...

      - name: Run Leak Lab runtime watcher tests
        if: matrix.os == 'ubuntu-latest' && matrix.php-version == '8.4'
        working-directory: examples/demo-leak
        run: php bin/phpunit

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
