services:
  php-worker:
    build: .
    # Octane boots Laravel once, then serves every request from the same FrankenPHP worker
    command: php artisan octane:frankenphp --host=0.0.0.0 --port=80 --workers=1 --max-requests=100000
    ports:
      - "8090:80"
    environment:
      - IGOR_RUNTIME_MODE=worker
    volumes:
      - .:/app
    tty: true

  php-classic:
    build: .
    ports:
      - "8091:80"
    environment:
      - SERVER_NAME=:80
      - FRANKENPHP_CONFIG=
      - IGOR_RUNTIME_MODE=classic
    volumes:
      - .:/app
    tty: true
