services:
  php-worker:
    image: dunglas/frankenphp
    ports:
      - "8080:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - SERVER_NAME=:80
      - FRANKENPHP_CONFIG=worker ./public/index.php 1
      - APP_ENV=dev
      - APP_SECRET=igor_secret
    volumes:
      - .:/app
      # IgorPhpBundle sources, autoloaded from ../../src/php/ (see composer.json)
      - ../../src/php:/src/php:ro
    tty: true

  php-classic:
    image: dunglas/frankenphp
    ports:
      - "8081:80"
    environment:
      - SERVER_NAME=:80
      - FRANKENPHP_CONFIG=
      - APP_ENV=dev
      - APP_SECRET=igor_secret
    volumes:
      - .:/app
      # IgorPhpBundle sources, autoloaded from ../../src/php/ (see composer.json)
      - ../../src/php:/src/php:ro
    tty: true
