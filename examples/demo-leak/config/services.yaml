services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: true # FORCE Symfony to reveal every single class as a standalone service

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/Model/'
            - '../src/Internal/'

    # Private services, as in a standard Symfony application: Symfony removes the unused ones
    # and inlines the ones referenced only once (see the "Dead & inlined services" section of the README).
    App\Model\:
        resource: '../src/Model/'
        public: false

    App\Internal\:
        resource: '../src/Internal/'
        public: false

# Runtime Leak Watch (experimental): snapshots live shared services between requests and reports
# state that survived. Opt-in, and only meaningful when the kernel survives between requests.
when@dev:
    parameters:
        igor.runtime_watch.enabled: true
        igor.runtime_watch.phases: true

when@test:
    parameters:
        igor.runtime_watch.enabled: true
        igor.runtime_watch.phases: true
